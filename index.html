<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/businesscard.css">
    <title>Document</title>
</head>
<body>
    <div class="card">
        <div>
            <img src="./images/myimage.png" alt="My image" class="avatar">
        </div>
        <div>
            <h3>Bilal Jan</h3>
            <p>Frontend Developer</p>
            <h4>Stockholm, Sweden</h4>
        </div>
    </div>
    <div>
        <h1>Upgrade to pro</h1>
        <div class="pricing">
            <div>
                <h2>For indivisuals</h2>
                <ul>
                    <li>1 gb</li>
                    <li>No Support</li>
                </ul>
                <button>Buy Now</button>
            </div>
            <div>
                <h2>For Enterprise</h2>
                <ul>
                    <li>10 gb</li>
                    <li>Priority Support</li>
                </ul>
                <button>Contact US</button>
            </div>
        </div>
    </div>
    <div class="japan-flag">
        <div class="red-circle"></div>
    </div>
    <script src="./scripts/main.js"></script>
</body>
</html>
